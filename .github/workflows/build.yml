name: H3CKED UI Builder

on:
  workflow_dispatch:
    inputs:
      STOCK_DEVICE:
        description: "H3CKED-UI target device"
        required: true
        default: "SM-A226B"

      FW_MODEL:
        description: "Samsung firmware model to download"
        required: true
        default: "SM-A156B"

      CSC:
        description: "Samsung CSC"
        required: true
        default: "EVR"

      VERSION:
        description: "Firmware version (leave empty for latest)"
        required: false
        default: ""

      USE_UI_8_TETHERING_APEX:
        description: "Set to true if kernel BPF version is lower than 5.10"
        type: boolean
        required: true
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install & Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Cleaning junk files
        uses: rokibhasansagar/slimhub_actions@v25.42.5

      - name: Install required packages
        shell: bash
        run: |
          set -e
      
          sudo apt-get update
      
          sudo apt-get install -y \
            p7zip-full \
            lz4 \
            android-sdk-libsparse-utils \
            python3 \
            python3-pip \
            zipalign \
            unzip \
            default-jre \
            openjdk-17-jdk \
            brotli \
            e2fsprogs \
            zstd \
            aria2 \
            curl \
            jq
      
          pip3 install \
            liblp \
            tgcrypto \
            pyrogram \
            gdown
      
          echo "Downloading latest samloader..."
      
          SAMLOADER_URL=$(curl -fsSL \
            https://api.github.com/repos/topjohnwu/samloader-rs/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux-x86_64\\.zip$")) | .browser_download_url' \
            | head -n 1)
      
          if [ -z "$SAMLOADER_URL" ] || [ "$SAMLOADER_URL" = "null" ]; then
            echo "⛔️ Could not find the latest Linux x86_64 samloader release."
            exit 1
          fi
      
          echo "Downloading:"
          echo "$SAMLOADER_URL"
      
          curl -fL \
            "$SAMLOADER_URL" \
            -o /tmp/samloader.zip
      
          unzip -o \
            /tmp/samloader.zip \
            -d /tmp/samloader
      
          sudo install -m 755 \
            /tmp/samloader/samloader \
            /usr/local/bin/samloader
      
          echo "samloader installed:"
          samloader --version
      
          chmod +x bin/erofs-utils/extract.erofs
          chmod +x bin/erofs-utils/mkfs.erofs

      - name: Setup directories
        run: |
          chmod +x scripts/setup_directories.sh
          chmod +x scripts/zip_creation.sh
          chmod +x scripts/Knox_script.sh

          bash scripts/setup_directories.sh FIRMWARE WORK OUT

      - name: Set build environment
        shell: bash
        run: |
          echo "STOCK_DEVICE=${{ github.event.inputs.STOCK_DEVICE }}" >> "$GITHUB_ENV"
          echo "FW_MODEL=${{ github.event.inputs.FW_MODEL }}" >> "$GITHUB_ENV"
          echo "CSC=${{ github.event.inputs.CSC }}" >> "$GITHUB_ENV"
          echo "VERSION=${{ github.event.inputs.VERSION }}" >> "$GITHUB_ENV"

          echo "USE_UI_8_TETHERING_APEX=${{ github.event.inputs.USE_UI_8_TETHERING_APEX }}" >> "$GITHUB_ENV"
          echo "OUTPUT_FILESYSTEM=erofs" >> "$GITHUB_ENV"
          echo "H3CKED_UI_VERSION=1.2.0" >> "$GITHUB_ENV"

          echo "OUT_DIR=$PWD/OUT" >> "$GITHUB_ENV"
          echo "WORK_DIR=$PWD/WORK" >> "$GITHUB_ENV"
          echo "FIRM_DIR=$PWD/FIRMWARE" >> "$GITHUB_ENV"
          echo "DEVICES_DIR=$PWD/H3CKED-UI/Devices" >> "$GITHUB_ENV"
          echo "APKTOOL=$PWD/bin/apktool/apktool.jar" >> "$GITHUB_ENV"
          echo "VNDKS_COLLECTION=$PWD/H3CKED-UI/vndks" >> "$GITHUB_ENV"
          echo "BUILD_PARTITIONS=product,vendor,odm,system_ext,system" >> "$GITHUB_ENV"

      - name: Check repo
        shell: bash
        env:
          H3CKED-UI_BUILD: ${{ secrets.H3CKED-UI_BUILD }}
          OFFICIAL_HASH: ${{ secrets.OFFICIAL_HASH }}
        run: |
          source scripts/H3CKED-UI.sh
          IS_OFFICIAL

      - name: Load device configuration
        shell: bash
        run: |
          source "$DEVICES_DIR/$STOCK_DEVICE/config"

      - name: Download firmware
        shell: bash
        run: |
          source scripts/H3CKED-UI.sh
          source "$DEVICES_DIR/$STOCK_DEVICE/config"

          echo "======================================"
          echo "  Firmware Configuration"
          echo "======================================"
          echo "Target Device:    $STOCK_DEVICE"
          echo "Firmware Model:   $FW_MODEL"
          echo "CSC:              $CSC"
          echo "Version:          ${VERSION:-Latest}"
          echo "======================================"

          DOWNLOAD_FIRMWARE \
            "$FW_MODEL" \
            "$CSC" \
            "$FIRM_DIR" \
            "$VERSION"

      - name: Extract firmware
        shell: bash
        run: |
          source scripts/H3CKED-UI.sh

          EXTRACT_FIRMWARE "FIRMWARE"
          PREPARE_PARTITIONS "FIRMWARE"
          EXTRACT_FIRMWARE_IMG "FIRMWARE"

      - name: Apply vendor patches
        shell: bash
        run: |
          source scripts/H3CKED-UI.sh

          DISABLE_FBE "FIRMWARE"
          DISABLE_FDE "FIRMWARE"
          DELETE_ICCC "FIRMWARE"
          DEBLOAT_VENDOR "FIRMWARE"
          PATCH_FSTAB_EROFS "FIRMWARE"

      - name: Apply stock config
        shell: bash
        run: |
          source scripts/H3CKED-UI.sh
          APPLY_STOCK_CONFIG "FIRMWARE"

      - name: Debloat ROM
        shell: bash
        run: |
          source scripts/H3CKED-UI.sh
          DEBLOAT "FIRMWARE"

      - name: Apply features
        shell: bash
        run: |
          source scripts/H3CKED-UI.sh
          APPLY_FEATURES "FIRMWARE"

      - name: Apply H3CKED-UI patches
        shell: bash
        run: |
          source scripts/H3CKED-UI.sh
          APPLY_MODS "FIRMWARE"

      - name: Update Build ID
        shell: bash
        run: |
          source scripts/H3CKED-UI.sh
          APPENDING_DISPLAY_ID "FIRMWARE"

      - name: Install stock framework-res
        shell: bash
        run: |
          source scripts/H3CKED-UI.sh

          INSTALL_FRAMEWORK \
            "FIRMWARE/system/system/framework/framework-res.apk"

      - name: Decompile framework jars
        shell: bash
        run: |
          source scripts/H3CKED-UI.sh

          DECOMPILE "$APKTOOL" \
            "FIRMWARE/system/system/framework/ssrm.jar" \
            "$WORK_DIR"

          DECOMPILE "$APKTOOL" \
            "FIRMWARE/system/system/framework/services.jar" \
            "$WORK_DIR"

      - name: Patch Knox
        shell: bash
        run: |
          source scripts/Knox_script.sh

          PATCH_SSRM "$WORK_DIR/ssrm"
          PATCH_KNOX_GUARD "$WORK_DIR/services"
          PATCH_FLAG_SECURE "$WORK_DIR/services"
          PATCH_SECURE_FOLDER "$WORK_DIR/services"
          PATCH_PRIVATE_SHARE "$WORK_DIR/services"
          DISABLE_SIGNATURE_VERIFICATION "$WORK_DIR/services"

      - name: Recompile framework
        shell: bash
        run: |
          source scripts/H3CKED-UI.sh

          RECOMPILE "$APKTOOL" \
            "$WORK_DIR/ssrm" \
            "FIRMWARE/system/system/framework" \
            "$WORK_DIR"

          RECOMPILE "$APKTOOL" \
            "$WORK_DIR/services" \
            "FIRMWARE/system/system/framework" \
            "$WORK_DIR"

          cp -fv "$WORK_DIR"/*.jar \
            "FIRMWARE/system/system/framework/"

      - name: Build ROM
        shell: bash
        run: |
          source scripts/H3CKED-UI.sh

          BUILD_IMG \
            "FIRMWARE" \
            "$OUTPUT_FILESYSTEM" \
            "$OUT_DIR"

          IMG_TO_BROTLI "$OUT_DIR" "TMP"

      - name: Update updater-script
        shell: bash
        run: |
          source scripts/zip_creation.sh
          UPDATE_ZIP_SCRIPT "FIRMWARE"

      - name: Prepare flashable zip
        shell: bash
        run: |
          source scripts/zip_creation.sh
          FLASHABLE_ZIP_CREATION

      - name: Sending ROM to GoFile
        run: |
          chmod +x ./upload.sh
          bash ./upload.sh "$(pwd)/template/${ZIP_NAME}"

      - name: Cleanup
        run: |
          sudo rm -rf *
